<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #ffffff;
      color: #071a3d;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .container {
      max-width: 900px;
      width: 100%;
    }

    h1 {
      font-size: clamp(5rem, 13vw, 9rem);
      line-height: 0.9;
      font-weight: 800;
      letter-spacing: -0.05em;
      margin-bottom: 24px;
    }

    p {
      font-size: 1.35rem;
      line-height: 1.7;
      color: #4b5b74;
      margin-bottom: 48px;
      max-width: 560px;
    }

    a {
      display: inline-block;
      padding: 18px 42px;
      border-radius: 999px;
      background: #12a56d;
      color: #fff;
      text-decoration: none;
      font-size: 1.05rem;
      font-weight: 600;
      transition: background 0.2s ease;
    }

    a:hover {
      background: #0d915f;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>
      404.<br>
      Page not<br>
      found.
    </h1>

    <p>
      The page you're looking for doesn't exist or may have been moved.
    </p>

    <a href="/">Return to Home</a>
  </div>
</body>
</html>
